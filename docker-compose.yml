# KasagiChat ローカル開発環境 (auth実験)
# 前提: このリポジトリと ../KasagiChat-Background が並んで置かれていること
#
#   docker compose up -d       … 全部起動 (初回はダウンロードで数分〜10分程度)
#   docker compose logs -f     … ログ確認
#   docker compose restart backend … バックエンドのコード変更を反映
#
# OAuthのクライアントID/シークレットは同じ場所の .env に書く (.env.example 参照)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kasagichat
      POSTGRES_USER: kasagichat
      POSTGRES_PASSWORD: kasagichat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasagichat -d kasagichat"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: sh ./gradlew bootRun
    environment:
      GRADLE_USER_HOME: /gradle-cache
      DB_URL: jdbc:postgresql://db:5432/kasagichat
      DB_USERNAME: kasagichat
      DB_PASSWORD: kasagichat
      APP_PUBLIC_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy-client-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
    volumes:
      - ../KasagiChat-Background:/workspace
      - gradle-cache:/gradle-cache
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_ORIGIN: http://backend:8080
      # Windowsのバインドマウントではファイル変更イベントが飛ばないためポーリングで検知
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  gradle-cache:
  frontend-node-modules:
